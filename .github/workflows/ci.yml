name: Continuous integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and verification dependency
        run: python -m pip install --editable ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q src tests scripts

      - name: Run automated tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Verify contracts and deterministic outputs
        run: python scripts/verify_release.py

      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/wheels"

      - name: Smoke-test installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/smoke-venv"
          "$RUNNER_TEMP/smoke-venv/bin/python" -m pip install \
            --no-deps "$RUNNER_TEMP"/wheels/*.whl
          "$RUNNER_TEMP/smoke-venv/bin/python" -m osna_pipeline \
            --input data/raw/synthetic \
            --validate-only > "$RUNNER_TEMP/readiness.json"
          test -s "$RUNNER_TEMP/readiness.json"
