<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">High-level OSNA Pathway Pipeline flow</title>
  <desc id="desc">Four clinical source domains feed batch ingestion and a landing area. Data is mapped and validated, then either produces a validation-only readiness report or proceeds through exact identifier matching, a canonical event model, transformations, quality checks, metrics, and curated audit outputs. CSV and JSON evidence is implemented; BI and web interfaces are optional future layers.</desc>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#586977"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #0b1f33; }
      .subtitle { font: 400 18px Arial, Helvetica, sans-serif; fill: #586977; }
      .section { font: 700 15px Arial, Helvetica, sans-serif; letter-spacing: 1.5px; fill: #087e78; }
      .node-title { font: 700 20px Arial, Helvetica, sans-serif; fill: #0b1f33; text-anchor: middle; }
      .node-detail { font: 400 14px Arial, Helvetica, sans-serif; fill: #586977; text-anchor: middle; }
      .small-title { font: 700 17px Arial, Helvetica, sans-serif; fill: #0b1f33; text-anchor: middle; }
      .small-detail { font: 400 13px Arial, Helvetica, sans-serif; fill: #586977; text-anchor: middle; }
      .source { fill: #e3f5f2; stroke: #087e78; stroke-width: 2.5; }
      .implemented { fill: #e7f3ec; stroke: #2e8059; stroke-width: 2.5; }
      .hybrid { fill: #f4f7f9; stroke: #2d63a8; stroke-width: 2.5; }
      .validation { fill: #fbf2df; stroke: #c88a1a; stroke-width: 2.5; }
      .future { fill: #eaf1fa; stroke: #2d63a8; stroke-width: 2.5; stroke-dasharray: 10 7; }
      .flow { fill: none; stroke: #586977; stroke-width: 3; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #c88a1a; stroke-width: 3; marker-end: url(#arrow); }
      .future-flow { fill: none; stroke: #2d63a8; stroke-width: 3; stroke-dasharray: 9 7; marker-end: url(#arrow); }
      .bus { fill: none; stroke: #9cabb5; stroke-width: 3; }
      .legend { font: 400 14px Arial, Helvetica, sans-serif; fill: #172634; }
    </style>
  </defs>

  <rect x="1" y="1" width="1598" height="1048" rx="22" fill="#ffffff" stroke="#d7e0e5" stroke-width="2"/>

  <text x="800" y="52" class="title" text-anchor="middle">High-level OSNA Pathway Pipeline flow</text>
  <text x="800" y="84" class="subtitle" text-anchor="middle">Existing systems remain authoritative; the pipeline reconstructs audit evidence across their records.</text>

  <text x="40" y="120" class="section">SOURCE DOMAINS</text>

  <rect x="40" y="140" width="340" height="78" rx="12" class="source"/>
  <text x="210" y="173" class="node-title">Theatre / EPR</text>
  <text x="210" y="198" class="node-detail">case, procedure and specimen events</text>

  <rect x="433" y="140" width="340" height="78" rx="12" class="source"/>
  <text x="603" y="173" class="node-title">Laboratory / LIMS</text>
  <text x="603" y="198" class="node-detail">receipt and verified result events</text>

  <rect x="826" y="140" width="340" height="78" rx="12" class="source"/>
  <text x="996" y="173" class="node-title">OSNA analyser</text>
  <text x="996" y="198" class="node-detail">run, result and QC facts</text>

  <rect x="1219" y="140" width="340" height="78" rx="12" class="source"/>
  <text x="1389" y="173" class="node-title">Communication record</text>
  <text x="1389" y="198" class="node-detail">communication and acknowledgement</text>

  <path d="M 210 218 V 245 H 800" class="bus"/>
  <path d="M 603 218 V 245 H 800" class="bus"/>
  <path d="M 996 218 V 245 H 800" class="bus"/>
  <path d="M 1389 218 V 245 H 800" class="bus"/>
  <path d="M 800 245 V 264" class="flow"/>

  <text x="40" y="278" class="section">INGESTION AND LANDING</text>

  <rect x="590" y="270" width="420" height="72" rx="12" class="hybrid"/>
  <text x="800" y="300" class="node-title">Batch extract ingestion</text>
  <text x="800" y="324" class="node-detail">synthetic CSV today; governed connectors later</text>

  <path d="M 800 342 V 368" class="flow"/>

  <rect x="590" y="374" width="420" height="72" rx="12" class="hybrid"/>
  <text x="800" y="404" class="node-title">Landing area</text>
  <text x="800" y="428" class="node-detail">local files today; governed storage later</text>

  <text x="40" y="468" class="section">IMPLEMENTED PIPELINE CORE</text>
  <path d="M 800 446 V 478 H 170 V 505" class="flow"/>

  <rect x="40" y="512" width="260" height="90" rx="12" class="implemented"/>
  <text x="170" y="545" class="small-title">Mapping and</text>
  <text x="170" y="567" class="small-title">source validation</text>
  <text x="170" y="587" class="small-detail">explicit fields and codes</text>

  <path d="M 300 557 H 342" class="flow"/>

  <rect x="350" y="512" width="260" height="90" rx="12" class="implemented"/>
  <text x="480" y="546" class="small-title">Exact identifier</text>
  <text x="480" y="568" class="small-title">matching</text>
  <text x="480" y="588" class="small-detail">no probabilistic linkage</text>

  <path d="M 610 557 H 652" class="flow"/>

  <rect x="660" y="512" width="260" height="90" rx="12" class="implemented"/>
  <text x="790" y="546" class="small-title">Canonical OSNA</text>
  <text x="790" y="568" class="small-title">event model</text>
  <text x="790" y="588" class="small-detail">source-neutral with lineage</text>

  <path d="M 920 557 H 962" class="flow"/>

  <rect x="970" y="512" width="260" height="90" rx="12" class="implemented"/>
  <text x="1100" y="546" class="small-title">Run and timeline</text>
  <text x="1100" y="568" class="small-title">transformations</text>
  <text x="1100" y="588" class="small-detail">specimen and procedure views</text>

  <path d="M 1230 557 H 1272" class="flow"/>

  <rect x="1280" y="512" width="260" height="90" rx="12" class="implemented"/>
  <text x="1410" y="546" class="small-title">Quality checks</text>
  <text x="1410" y="568" class="small-title">and metrics</text>
  <text x="1410" y="588" class="small-detail">exceptions and durations</text>

  <path d="M 170 602 V 646" class="branch"/>

  <rect x="40" y="654" width="260" height="94" rx="12" class="validation"/>
  <text x="170" y="684" class="small-title">Validation-only</text>
  <text x="170" y="706" class="small-title">readiness report</text>
  <text x="170" y="728" class="small-detail">no linkage or metrics</text>

  <path d="M 1410 602 V 646" class="flow"/>

  <rect x="1280" y="654" width="260" height="94" rx="12" class="implemented"/>
  <text x="1410" y="686" class="small-title">Curated audit</text>
  <text x="1410" y="708" class="small-title">outputs</text>
  <text x="1410" y="729" class="small-detail">detail, summaries and manifest</text>

  <text x="40" y="802" class="section">EVIDENCE AND PRESENTATION</text>
  <path d="M 1410 748 V 790 H 580" class="bus"/>
  <path d="M 580 790 V 830" class="flow"/>
  <path d="M 1410 790 H 900 V 830" class="future-flow"/>
  <path d="M 1410 790 H 1220 V 830" class="future-flow"/>

  <rect x="430" y="838" width="300" height="76" rx="12" class="implemented"/>
  <text x="580" y="870" class="node-title">CSV and JSON evidence</text>
  <text x="580" y="895" class="node-detail">implemented current output</text>

  <rect x="750" y="838" width="300" height="76" rx="12" class="future"/>
  <text x="900" y="870" class="node-title">BI dashboard</text>
  <text x="900" y="895" class="node-detail">optional future presentation</text>

  <rect x="1070" y="838" width="300" height="76" rx="12" class="future"/>
  <text x="1220" y="870" class="node-title">Thin internal web interface</text>
  <text x="1220" y="895" class="node-detail">optional future workflow layer</text>

  <rect x="40" y="952" width="1500" height="58" rx="10" fill="#f4f7f9" stroke="#7a8792" stroke-width="2"/>
  <text x="790" y="978" class="small-title">Cross-cutting reproducibility and lineage</text>
  <text x="790" y="999" class="small-detail">source identifiers, schema versions, SHA-256 checksums and deterministic batch manifests</text>

  <rect x="55" y="1022" width="18" height="18" rx="3" class="implemented"/>
  <text x="82" y="1037" class="legend">Implemented pipeline capability</text>
  <rect x="340" y="1022" width="18" height="18" rx="3" class="hybrid"/>
  <text x="367" y="1037" class="legend">Current local / future governed layer</text>
  <rect x="710" y="1022" width="18" height="18" rx="3" class="validation"/>
  <text x="737" y="1037" class="legend">Validation-only branch</text>
  <rect x="970" y="1022" width="18" height="18" rx="3" class="future"/>
  <text x="997" y="1037" class="legend">Optional future component</text>
</svg>
